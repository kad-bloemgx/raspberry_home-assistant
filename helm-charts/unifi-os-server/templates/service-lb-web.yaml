apiVersion: v1

kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.nameSpace }}

spec:
  allocateLoadBalancerNodePorts: false
  ports:
    - protocol: TCP
      name: webui-svc
      port: 80
      targetPort: 80
  type: LoadBalancer
  selector:
    app: {{ .Values.appName }}