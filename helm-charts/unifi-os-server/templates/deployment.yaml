apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.nameSpace }}
  labels:
    app: {{ .Values.appName }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi-os-server
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: UOS_SYSTEM_IP
              value: "unifi.example.com"
          securityContext:
            privileged: true
          volumeMounts:
            - name: unifi-os-server-data
              mountPath: /persistent
              subPath: persistent
            - name: unifi-os-server-data
              mountPath: /var/log
              subPath: log
            - name: unifi-os-server-data
              mountPath: /data
              subPath: data
            - name: unifi-os-server-data
              mountPath: /srv
              subPath: srv
            - name: unifi-os-server-data
              mountPath: /var/lib/unifi
              subPath: unifi
            - name: unifi-os-server-data
              mountPath: /var/lib/mongodb
              subPath: mongodb
            - name: unifi-os-server-data
              mountPath: /etc/rabbitmq/ssl
              subPath: rabbitmq
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: unifi-os-server-data
          persistentVolumeClaim:
            claimName: unifi-os-server-pvc