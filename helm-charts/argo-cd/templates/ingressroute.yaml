{{- if .Values.ingress.enabled }}
kind: IngressRoute
apiVersion: traefik.io/v1alpha1

metadata:
  name: argocd-ingressroute
  namespace: argo-cd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: myresolver
{{- end }}
