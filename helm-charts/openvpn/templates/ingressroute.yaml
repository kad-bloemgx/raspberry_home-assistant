kind: IngressRoute
apiVersion: traefik.io/v1alpha1

metadata:
  name: ingressroutetls
  namespace: {{ .Values.nameSpace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openvpn-adm.gerardbloemendaal.freemyip.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: openvpn-admin
          port: {{ .Values.container.portAdmin }}
          scheme: https
          insecureSkipVerify: true
    - match: Host(`openvpn.gerardbloemendaal.freemyip.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: openvpn
          port: {{ .Values.container.portTCP }}
          scheme: https
          insecureSkipVerify: true
  tls:
    certResolver: myresolver