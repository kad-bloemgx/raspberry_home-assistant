kind: IngressRoute
apiVersion: traefik.io/v1alpha1

metadata:
  name: ingressroutetls
  namespace: {{ .Values.nameSpace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openvpn.gerardbloemendaal.freemyip.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{ .Values.appName }}
          port: {{ .Values.container.portTCP }}
  tls:
    certResolver: myresolver