kind: Service
apiVersion: v1

metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.nameSpace }}
  labels:
    app: {{ .Values.appName }}
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: {{ .Values.container.portTCP}}
      name: portTCP
    - protocol: TCP
      port: {{ .Values.container.portAdmin }}
      name: portAdmin