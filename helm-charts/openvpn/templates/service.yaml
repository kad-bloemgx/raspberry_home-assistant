kind: Service
apiVersion: v1

metadata:
  name: openvpn
  namespace: {{ .Values.nameSpace }}
  labels:
    app: {{ .Values.appName }}
spec:
  selector:
    app: {{ .Values.appName }}
  type: NodePort
  ports:
    - name: openvpn
      port: {{.Values.container.portTCP}}
      protocol: TCP
      targetPort: {{.Values.container.portTCP}}
      nodePort: 30051