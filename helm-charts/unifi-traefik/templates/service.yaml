apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.nameSpace }}

spec:
  ports:
    - protocol: TCP
      name: web
      port: 9080
    - protocol: TCP
      name: admin
      port: 9000
    - protocol: TCP
      name: websecure
      port: 9443
  type: LoadBalancer
  selector:
    app: {{ .Values.appName }}