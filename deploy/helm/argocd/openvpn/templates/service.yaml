kind: Service
apiVersion: v1

metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.nameSpace }}
  labels:
    app: {{ .Values.appName }}
spec:
  selector:
    app: {{ .Values.appName }}
  type: ClusterIP
  ports:
    - name: openvpn
      port: {{.Values.container.portTCP}}
      protocol: TCP
      targetPort: {{.Values.container.portTCP}}
    - name: ui
      port: {{ .Values.container.portAdmin }}
      protocol: TCP
      targetPort: {{ .Values.container.portAdmin }}
