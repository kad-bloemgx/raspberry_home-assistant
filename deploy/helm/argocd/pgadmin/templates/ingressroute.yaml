{{- if .Values.ingress.enabled }}
kind: IngressRoute
apiVersion: traefik.io/v1alpha1


metadata:
  name: pgadmin-ingressroute
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: pgadmin
          port: {{ .Values.pgadmin4.service.port }}
  tls:
    certResolver: myresolver
{{- end }}
