{{- if .Values.ingress.enabled }}
kind: IngressRoute
apiVersion: traefik.io/v1alpha1

metadata:
  name: homeassistant-ingressroute
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: homeassistant
          port: 8123
  tls:
    certResolver: myresolver
{{- end }}
