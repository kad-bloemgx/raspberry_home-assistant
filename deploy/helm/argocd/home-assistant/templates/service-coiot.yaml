{{- if .Values.coiot.enabled }}
kind: Service
apiVersion: v1

metadata:
  name: nodeport-coiot
  namespace: {{ .Values.nameSpace }}
spec:
  selector:
    app: {{ .Values.appName }}
  type: NodePort
  ports:
    - name: coiot
      port: 5683
      targetPort: 5683
      nodePort: {{ .Values.coiot.nodePort }}
      protocol: UDP
{{- end }}
