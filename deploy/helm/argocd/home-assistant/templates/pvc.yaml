kind: PersistentVolumeClaim
apiVersion: v1

metadata:
  name: local-path-pvc
  namespace: {{ .Values.nameSpace }}
  annotations:
    "helm.sh/resource-policy": keep

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
